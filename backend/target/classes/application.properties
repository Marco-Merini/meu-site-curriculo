spring.application.name=portfolio-api
server.port=${PORT:8080}

# Origens permitidas via CORS (separadas por virgula, sem curinga irrestrito)
portfolio.cors.allowed-origins=${PORTFOLIO_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Integracao opcional de servico de envio de e-mail via variaveis de ambiente
portfolio.mail.enabled=${PORTFOLIO_MAIL_ENABLED:false}
portfolio.mail.webhook-url=${PORTFOLIO_MAIL_WEBHOOK_URL:}
portfolio.mail.api-token=${PORTFOLIO_MAIL_API_TOKEN:}
portfolio.mail.from=${PORTFOLIO_MAIL_FROM:}
